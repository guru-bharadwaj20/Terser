name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # Row 11.4.1 budget: the median PR run must finish in <= 15 min; this caps any single job.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face tokenizers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-v1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (~200 MB vs ~2.5 GB CUDA) so torch tests (rows 4.1.3, 8.2.x, 8.3.2) run, not skip.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # orchestrate: Prefect, so tests/test_flows.py (rows 11.6.x) runs rather than skips.
          python -m pip install -e ".[dev,hpo,serve,export,mlops,orchestrate]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy src

      - name: CPU smoke training (row 8.3.2)
        run: pytest tests/rewriter/test_train_tiny.py -q

      - name: DVC pipeline dry run
        # Raw data is not pulled in CI; --allow-missing still checks the DAG and stage hashes.
        run: dvc repro --dry --allow-missing

      - name: Test-set isolation audit (row 10.8)
        run: python -m terser.hpo.audit --scan src/terser

      - name: Feature parity (row 11.1.3)
        run: pytest tests/features -q

      - name: Tokenizer drift (row 11.5.3)
        run: python -m terser.monitoring.tokenizer_drift

      - name: Tests (CPU)
        # The CPU smoke training and feature parity tests already ran in their own steps.
        run: >-
          pytest -m "not gpu and not api" --cov=terser --cov-report=term
          --ignore=tests/features --ignore=tests/rewriter/test_train_tiny.py
