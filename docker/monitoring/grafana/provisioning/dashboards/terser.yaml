# Row 11.5.5: load every dashboard JSON under docker/monitoring/grafana/dashboards (mounted at
# /var/lib/grafana/dashboards) into the "Terser" folder.
apiVersion: 1

providers:
  - name: terser
    orgId: 1
    folder: Terser
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
