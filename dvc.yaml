# Dataset pipeline (plan rows 2.1.7, 11.1.2):
#   collect -> casualise -> dedupe -> split (+ stratification) -> label_subset -> candidates
#   -> token_counts -> respond@<target> -> label (judge + label) -> oracle -> features
#   dvc repro features
# The LLM stages (casualise, candidates, respond, label) call a local OpenAI-compatible server
# (vLLM, see the stage comments) only for requests that are not yet in .cache/llm_responses.
# With a populated cache, `TERSER_LLM_CACHE_ONLY=1 dvc repro` rebuilds every stage on CPU with
# identical outputs and fails on a cache miss instead of calling a model
# (reports/p11_dvc_repro.md).
stages:
  collect:
    # Stale by design since 2.1.3 (scrub instead of drop): the locked clean.jsonl and the
    # frozen test split are kept; see reports/p2_dvc_repro.md, "Known stale stage". Frozen, so
    # `dvc status` / `dvc repro` keep the locked output; the locked code (9092ee6) reproduces
    # it byte for byte (reports/p11_dvc_repro.md). Unfreeze for a new dataset version.
    frozen: true
    cmd: >-
      python -m terser.data.collect --out data/interim/clean.jsonl
      --per-category ${collect.per_category} --seed ${seed}
      --min-words ${collect.min_words} --max-words ${collect.max_words}
      --stats reports/p2_collect_stats.json
    deps:
      - src/terser/data/collect.py
      - src/terser/data/sources.py
      - src/terser/data/pii.py
      - data/raw/dolly
      # oasst1 has no task-type label, so collect drops every oasst1 record (0 in clean.jsonl).
      # Removing the dep changes the stage hash and needs a `dvc repro collect`; until then it
      # stays listed.
      - data/raw/oasst1
      - data/raw/humaneval
      - data/raw/mbpp
      - data/raw/gsm8k
    params:
      - seed
      - collect
    outs:
      - data/interim/clean.jsonl
    metrics:
      - reports/p2_collect_stats.json:
          cache: false

  casualise:
    # GPU: vllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --quantization awq_marlin --max-model-len 4096
    #        --gpu-memory-utilization 0.90 --max-num-batched-tokens 2048 --max-num-seqs 64
    #      export TERSER_LOCAL_LLM_URL=http://localhost:8000/v1
    cmd: >-
      python -m terser.data.casualise --in data/interim/clean.jsonl
      --out data/interim/casual.jsonl --rejected data/interim/casual_rejected.jsonl
      --model ${casualise.model} --workers ${casualise.workers}
      --max-ratio ${casualise.max_ratio} --temperature ${casualise.temperature}
      --stats reports/p2_casualise_stats.json
    deps:
      - data/interim/clean.jsonl
      - src/terser/data/casualise.py
      - src/terser/data/prompts/casualise_v1.txt
      - src/terser/data/prompts/casualise_check_v1.txt
    params:
      - casualise.model
      - casualise.max_ratio
      - casualise.temperature
    outs:
      - data/interim/casual.jsonl
      - data/interim/casual_rejected.jsonl
    metrics:
      - reports/p2_casualise_stats.json:
          cache: false

  dedupe:
    cmd: >-
      python -m terser.data.dedupe --in data/interim/casual.jsonl
      --out data/interim/casual_dedup.jsonl --report reports/p2_duplicates.md
      --threshold ${dedupe.threshold} --seed ${seed}
      --source-priority ${dedupe.source_priority}
    deps:
      - data/interim/casual.jsonl
      - src/terser/data/dedupe.py
    params:
      - seed
      - dedupe
    outs:
      - data/interim/casual_dedup.jsonl
      - reports/p2_duplicates.md:
          cache: false

  split:
    # Also the "stratify" step of row 11.1.2; there is no separate stage. Whole source groups
    # go to train / val / test by a seeded hash, which stratifies by category and by source in
    # expectation without reshuffling existing groups when data is added (splits.py
    # docstring); per-category and per-source proportions are reported in splits.json.
    # label_subset then draws an exact per-category quota from the splits.
    cmd: >-
      python -m terser.data.splits --in data/interim/casual_dedup.jsonl
      --out-dir data/processed/splits --seed ${seed}
      --train-frac ${split.train_frac} --val-frac ${split.val_frac}
      --expect-test-sha256 ${split.test_sha256} --freeze
    deps:
      - data/interim/casual_dedup.jsonl
      - src/terser/data/splits.py
    params:
      - seed
      - split
    outs:
      - data/processed/splits

  label_subset:
    cmd: >-
      python -m terser.data.label_subset --splits-dir data/processed/splits
      --out data/interim/label_prompts.jsonl --per-category ${label_subset.per_category}
      --seed ${seed}
    deps:
      - data/processed/splits
      - src/terser/data/label_subset.py
    params:
      - seed
      - label_subset
    outs:
      - data/interim/label_prompts.jsonl

  candidates:
    # GPU: same vLLM server as casualise (32B-AWQ); LLMLingua-2 runs on CPU.
    cmd: >-
      python -m terser.data.candidates experiment=p2_candidates hardware=rtx4500ada
      experiment.params.stand_in=false experiment.params.rewrite_model=${candidates.model}
      experiment.params.prompts_path=data/interim/label_prompts.jsonl
      experiment.params.output_path=data/interim/candidates.jsonl
      experiment.params.workers=${candidates.workers}
    deps:
      - data/interim/label_prompts.jsonl
      - src/terser/data/candidates.py
      - src/terser/data/prompts/rewrite_v1.txt
      - configs/experiment/p2_candidates.yaml
    params:
      - candidates.model
    outs:
      - data/interim/candidates.jsonl

  token_counts:
    cmd: >-
      python -m terser.data.token_counts --prompts data/interim/label_prompts.jsonl
      --candidates data/interim/candidates.jsonl --out data/interim/token_counts.parquet
    deps:
      - data/interim/label_prompts.jsonl
      - data/interim/candidates.jsonl
      - src/terser/data/token_counts.py
      - src/terser/tokenizers/count.py
    outs:
      - data/interim/token_counts.parquet

  respond:
    # Row 2.2.3: target outputs for every label prompt and non-rejected candidate.
    # GPU: vllm serve <target> (one target at a time); export TERSER_LOCAL_LLM_URL=http://localhost:8000/v1
    foreach: ${respond.targets}
    do:
      cmd: >-
        python -m terser.phase2.respond --prompts data/interim/label_prompts.jsonl
        --candidates data/interim/candidates.jsonl --target ${item}
        --out data/interim/responses/${key}.jsonl --max-tokens ${respond.max_tokens}
        --creative-samples ${respond.creative_samples}
        --creative-temperature ${respond.creative_temperature} --workers ${respond.workers}
      deps:
        - data/interim/label_prompts.jsonl
        - data/interim/candidates.jsonl
        - src/terser/phase2/respond.py
      params:
        - respond.max_tokens
        - respond.creative_samples
        - respond.creative_temperature
      outs:
        - data/interim/responses/${key}.jsonl

  label:
    # Rows 2.3.3 + 2.3.4: judge (ADR-0005 pairwise_avg, both A/B orders) and task metrics, then
    # label_v1 records. Task-metric results are cached under .cache/task_metrics.
    # GPU: vllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --quantization awq_marlin --max-model-len 4096
    cmd: >-
      python -m terser.phase2.label_stage --prompts data/interim/label_prompts.jsonl
      --responses data/interim/responses/qwen2.5-7b.jsonl
      data/interim/responses/phi3.5-mini.jsonl
      --judge-model ${label.judge_model} --splits-dir data/processed/splits
      --out data/processed/labels.jsonl --workers ${label.workers}
    deps:
      - data/interim/label_prompts.jsonl
      - data/interim/responses/qwen2.5-7b.jsonl
      - data/interim/responses/phi3.5-mini.jsonl
      - data/processed/splits
      - data/raw/humaneval
      - data/raw/mbpp
      - src/terser/phase2/label_stage.py
      - src/terser/judge/protocols.py
      - src/terser/judge/pairwise.py
      - src/terser/judge/rubrics.py
      - src/terser/judge/rubrics
      - src/terser/judge/prompts/pairwise_v1.txt
      - src/terser/judge/metrics.py
      - src/terser/judge/code_runner.py
      - src/terser/judge/labels.py
    params:
      - label.judge_model
    outs:
      - data/processed/labels.jsonl

  oracle:
    # Row 2.4.1: the shortest preserved candidate per (prompt, target); CPU only.
    cmd: >-
      python -m terser.phase2.oracle --candidates data/interim/candidates.jsonl
      --token-counts data/interim/token_counts.parquet --labels data/processed/labels.jsonl
      --prompts data/interim/label_prompts.jsonl
      --target-map Qwen/Qwen2.5-7B-Instruct=qwen2.5 microsoft/Phi-3.5-mini-instruct=phi3.5
      --out data/processed/oracle.csv
    deps:
      - data/interim/candidates.jsonl
      - data/interim/token_counts.parquet
      - data/processed/labels.jsonl
      - data/interim/label_prompts.jsonl
      - src/terser/phase2/oracle.py
    outs:
      - data/processed/oracle.csv

  features:
    # Rows 3.1.2 + 3.1.3: pair and span feature tables (train split only); CPU. overhead_pct
    # comes from the pricing in configs/serving/default.yaml.
    cmd: python -m terser.phase3.build_features --device cpu
    deps:
      - data/interim/label_prompts.jsonl
      - data/interim/candidates.jsonl
      - data/processed/labels.jsonl
      - data/processed/oracle.csv
      - src/terser/phase3/build_features.py
      - src/terser/features/alignment.py
      - src/terser/features/embeddings.py
      - src/terser/features/lexicons.py
      - src/terser/features/pair.py
      - src/terser/features/span.py
      - src/terser/tokenizers/count.py
      - configs/serving/default.yaml
    outs:
      - data/processed/pair_features.parquet
      - data/processed/span_features.parquet

  register:
    # Rebuilds part of the MLflow model registry (rows 11.2.2, 11.2.3): gate, tagger and rewriter
    # rungs 1-3 (v1-v6) only. v7-v10 were registered by register_one / phase10.rewriter_hpo and
    # must be re-registered by hand after `dvc pull && dvc repro register` on a fresh clone.
    cmd: python -m terser.phase11.register
    deps:
      - src/terser/phase11/register.py
      - src/terser/tracking/lineage.py
      - models/fast
      - models/rewriter/sft-qwen0.5b-full
      - models/rewriter/sft-qwen1.5b-lora
      - models/rewriter/sft-qwen3b-lora
      - reports/p11_fast_path.json
      - reports/p8_rewriter_val.json
    outs:
      - reports/p11_registry.md:
          cache: false
