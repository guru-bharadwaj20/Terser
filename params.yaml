# DVC pipeline parameters (dvc.yaml, plan rows 2.1.7 and 11.1.2).
seed: 0
collect:
  per_category: 280      # x 5 styles = 8,400 generations; ~20% fail validation (smoke run) -> >= 6,000
  min_words: 3
  max_words: 350         # instruction + input; keeps target outputs inside a 4,096 context
casualise:
  model: Qwen/Qwen2.5-32B-Instruct-AWQ
  workers: 32
  max_ratio: 4.0
  temperature: 0.8       # generation only, with a per-request seed; the meaning check is greedy
dedupe:
  threshold: 0.8
  source_priority: humaneval,mbpp,gsm8k,dolly,oasst1
split:
  train_frac: 0.70
  val_frac: 0.15
  test_sha256: b4b264a80bcf8b1c415643b5f54156d214841e77088b75ae8b148bf2c9e106c7  # frozen test.jsonl; a rebuild that changes it fails
label_subset:
  per_category: 300      # labelled prompts per category; sized to the phase2 token cap (see label_subset.py)
candidates:
  model: Qwen/Qwen2.5-32B-Instruct-AWQ
  workers: 32
respond:                 # row 2.2.3; one stage per target (respond@<key>), output data/interim/responses/<key>.jsonl
  targets:
    qwen2.5-7b: Qwen/Qwen2.5-7B-Instruct
    phi3.5-mini: microsoft/Phi-3.5-mini-instruct   # second family, ADR-0011
  max_tokens: 768
  creative_samples: 3    # creative prompts: seeded samples (common random numbers across candidates)
  creative_temperature: 0.7
  workers: 64            # concurrent requests so vLLM can batch; no effect on the output
label:                   # rows 2.3.3 (judge, ADR-0005 pairwise_avg) + 2.3.4 (label)
  judge_model: Qwen/Qwen2.5-32B-Instruct-AWQ
  workers: 16
