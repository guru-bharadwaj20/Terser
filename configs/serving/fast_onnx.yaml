# Serving config with the row 11.3.2 ONNX fast path (gate + span tagger, `dvc pull models/fast`).
# TERSER_SERVING_CONFIG=configs/serving/fast_onnx.yaml uvicorn terser.serving.api:app

gate_threshold: 0.5
gate_onnx: models/fast/gate.onnx
gate_feature_target: qwen2.5   # the gate was trained on qwen2.5 token counts (row 11.3.2)
tagger_onnx: models/fast/tagger.onnx
tagger_threshold: 0.5
quality_timeout_s: 0.4
cache_size: 10000

quality:
  base_url: null
  model: null
  http_timeout_s: 2.0

pricing:
  target_input_per_mtok:
    gpt-4o: 2.50
    qwen2.5: 0.20
    llama-3.1: 0.20
  rewriter_input_per_mtok: 0.05
  rewriter_output_per_mtok: 0.10
  fast_path_per_request: 0.0
