# Row 2.2.3: target outputs (the `respond` stage).
#   python -m terser.data.respond experiment=p2_respond
#
# GPU (real outputs, vLLM bf16, one target served at a time):
#   vllm serve meta-llama/Llama-3.1-8B-Instruct --dtype bfloat16
#   export TERSER_LOCAL_LLM_URL=http://<gpu-host>:8000/v1
#   python -m terser.data.respond experiment=p2_respond hardware=rtx4500ada \
#     'experiment.params.targets=[meta-llama/Llama-3.1-8B-Instruct]'
#
# CPU smoke (stand-in, written ONLY to smoke_output_path):
#   python -m terser.data.respond experiment=p2_respond experiment.params.stand_in=true \
#     'experiment.params.targets=[qwen2.5:0.5b]' experiment.params.limit=5
name: p2_respond
phase: 2
row: "2.2.3"
task: respond
params:
  prompts_path: ${paths.data_dir}/pilot/prompts.jsonl
  candidates_path: ${paths.data_dir}/interim/pilot_candidates.jsonl
  output_path: ${paths.data_dir}/interim/responses.jsonl
  smoke_output_path: ${paths.data_dir}/interim/smoke/responses.jsonl
  targets: [meta-llama/Llama-3.1-8B-Instruct, Qwen/Qwen2.5-7B-Instruct]
  provider: local
  stand_in: false
  temperature: 0.0
  creative_category: creative
  creative_samples: 3
  creative_temperature: 0.7
  max_output_tokens: 1024
  base_seed: 0
  include_original: true
  limit: null
  budget_phase: phase2
