[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terser"
version = "0.1.0"
description = "Tokenizer-aware casual-to-efficient prompt rewriting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "python-dotenv",
    "scikit-learn",
    "lightgbm",
    "cvxopt",
    "matplotlib",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "anthropic",
    "tiktoken",
    "tokenizers",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "nbstripout",
    "types-PyYAML",
    "dvc",
]
openai = ["openai"]
# Installed only on the RTX 4500 Ada machine (Phase 7).
gpu = ["torch", "transformers", "peft", "trl", "vllm", "bitsandbytes", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]
