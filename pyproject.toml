[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terser"
version = "0.1.0"
description = "Tokenizer-aware casual-to-efficient prompt rewriting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "python-dotenv",
    "scikit-learn",
    "lightgbm",
    "cvxopt",
    "matplotlib",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "anthropic",
    "httpx",
    "tiktoken",
    "tokenizers",
    "huggingface_hub",
    "mlflow>=3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "nbstripout",
    "types-PyYAML",
    "dvc",
]
openai = ["openai"]
# NER backend for PII scrubbing (row 2.1.3); also run `python -m spacy download en_core_web_sm`.
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.8"]
# Hyperparameter search (row 10.1).
hpo = ["optuna>=4"]
# Inference service (rows 11.3.x, 11.5.1): FastAPI app, Prometheus metrics, ONNX fast path.
serve = ["fastapi>=0.110", "uvicorn", "prometheus-client", "onnxruntime", "skl2onnx"]
# Data validation (row 11.1.4).
mlops = ["pandera>=0.20"]
# Orchestration (rows 11.6.x); flows still run as plain callables without it.
orchestrate = ["prefect>=3"]
# LLMLingua-2 candidate baseline (row 2.2.1).
compress = ["llmlingua>=0.2.2"]
# Installed only on the RTX 4500 Ada machine (Phase 7).
gpu = ["torch", "transformers", "peft", "trl", "vllm", "bitsandbytes", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# numpy 2.x stubs use PEP 695 syntax, which mypy only parses when targeting >= 3.12.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
